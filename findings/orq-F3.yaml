id: orq-F3
app: prepare.py + harness/ (orquestrador)
entrypoint: harness/instance.py:Instance.stop
source_report: extras indicados pelo solicitante (regra nao pegou)
source_findings: ["extra:Instance.stop mata so o PID principal (harness/instance.py 147-152)"]
provenance:
  ai_reviews: []
  tools: []
classification: conditional

mechanism:
  summary: >
    Instance.stop() envia terminate/kill apenas a self.proc; descendentes do node nao sao encerrados (sem
    grupo de processos, sem psutil children kill) e, apos kill() por timeout, nao ha wait(). Alem disso, o
    node nao e iniciado em sessao propria nem ligado ao ciclo de vida do juiz, entao um prepare.py morto
    (SIGKILL, queda) deixa instancias node orfas. Em execucoes repetidas com falha, processos orfaos retem
    memoria/portas e contaminam medicoes seguintes.
  resource: processos (node e descendentes), portas e memoria do SO
  trigger: app que cria filhos (o sampler mede max_children, e o gate H4 so proibe isso em candidatos) ou encerramento abrupto do orquestrador/bracos durante run_arms; repetido ao longo das campanhas
  gap: sem kill de arvore (psutil.Process.children), sem wait() apos kill, sem atexit/signal handler para parar instancias
  suspect_code:
    - function: Instance.stop
      file: harness/instance.py
      lines: 143-152
    - function: Instance.start (Popen sem start_new_session)
      file: harness/instance.py
      lines: 91-95

aging_elements:
  repeatable_trigger: "Toda execucao inicia e para instancias via start()/stop(); orfandade so ocorre em falha ou se o app gerar filhos."
  accumulation_or_exhaustion: "Orfaos persistem ate reboot/kill manual; cada um mantem RSS e porta. No caminho normal sem filhos nada sobra."
  insufficient_bounding: "terminate/kill so no PID principal (instance.py:147-152); sem varredura de descendentes."
  plausible_degradation: "Condicional: memoria e CPU consumidas por orfaos reduzem a folga das 4 instancias paralelas e distorcem RSS/p95 em campanhas seguintes."

controllability:
  level: environment
  notes: >
    Exige manipular o ambiente (matar o juiz no meio da execucao) ou um app que forke; trafego HTTP sozinho
    nao basta. O app original nao foi inspecionado aqui (fora do escopo de entrada): se nao cria filhos, so o
    caminho de queda do juiz importa.

activation_criteria:
  path_executed: stop() chamado com children nao vazios, ou prepare.py encerrado antes de stop()
  resource_growth: "psutil: numero de processos node remanescentes apos o fim/queda de uma execucao > 0 e crescente entre campanhas"
  control_contrast: execucao normal sem filhos deve terminar com 0 processos node remanescentes (max_children == 0)

operacao_suspeita: prepare.py detect|repair|confirm|control (parada de instancia, Instance.stop)
expected_symptoms:
  - "handles_slope/rss do SO fora do juiz (processos orfaos), sem sintoma nas metricas da instancia"
  - "max_children > 0 no registro do braco quando houver filhos"

priority: 5
stability: "extras indicados pelo solicitante; 0 reviews de IA; 0 regras de ferramenta"
